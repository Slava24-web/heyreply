packages:
  - apps/*
  - packages/*
allowBuilds:
  sharp: true
  unrs-resolver: true
  "@prisma/engines": true
  prisma: true
  argon2: true
  "@nestjs/core": true
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  workerd: true
# Security: patched versions of transitive deps (pnpm audit). mysql2/deepmerge-ts come via the Prisma CLI, js-yaml via Swagger.
overrides:
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
