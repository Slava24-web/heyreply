# Builds the api, web and backup images and pushes them to GHCR. The server only pulls (see docs/DEPLOY.md).
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            build-args: ''
          - name: web
            context: .
            file: apps/web/Dockerfile
            # next.config.ts bakes HSTS in at build time; the production image is always served over HTTPS
            build-args: |
              HTTPS_ENABLED=true
              API_URL=http://api:4000
          - name: backup
            context: deploy/backup
            file: deploy/backup/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under QEMU (slower) so the same images run on free Arm servers (Oracle Cloud Ampere) and on x86
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner (GHCR requires it) and tags sha-<short> + latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/heyreply-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
