# Secrets come from ./.env (see .env.example) — compose refuses to start without them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heyreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: heyreply
    # Loopback only: the database is never reachable from the network. 5434 avoids the local dev DB on 5433.
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heyreply -d heyreply']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://heyreply:${POSTGRES_PASSWORD}@postgres:5432/heyreply?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (openssl rand -base64 48)}
      ACCESS_TTL_SECONDS: 900
      REFRESH_TTL_DAYS: 30
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Plain http on localhost; behind HTTPS set COOKIE_SECURE=true (the production default)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # web → api is one hop; add one per extra reverse proxy that overwrites X-Forwarded-For
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # E-mail import via Cloudflare Email Routing (optional, see README)
      # Password-reset e-mails (optional; without SMTP_URL no mail is sent). MAIL_FROM is required with it.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Per-user caps
      MAX_APPLICATIONS_PER_USER: ${MAX_APPLICATIONS_PER_USER:-5000}
      MAX_DICTIONARY_ITEMS_PER_USER: ${MAX_DICTIONARY_ITEMS_PER_USER:-2000}
    depends_on:
      postgres:
        condition: service_healthy
    # The browser talks to the API only through the web container; this port is for local debugging
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      DONATE_URL: ${DONATE_URL:-}
      EXTENSION_CHROME_URL: ${EXTENSION_CHROME_URL:-}
      EXTENSION_FIREFOX_URL: ${EXTENSION_FIREFOX_URL:-}
    depends_on:
      api:
        condition: service_healthy
    # Not published: only reachable through the edge proxy

  edge:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    ports:
      - '127.0.0.1:3000:80'

volumes:
  pgdata:
